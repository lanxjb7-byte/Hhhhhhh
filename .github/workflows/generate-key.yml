name: Generate Keystore
on: workflow_dispatch
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias lixxzy -keyalg RSA -keysize 2048 -validity 10000 -storepass changeme -keypass changeme -dname "CN=Unknown, OU=Unknown, O=Unknown, L=Unknown, ST=Unknown, C=Unknown"
          base64 -w 0 release.keystore > keystore_b64.txt
      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: keystore-b64
          path: keystore_b64.txt
