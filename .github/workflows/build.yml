name: build-lixxzy-tool
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools' }
      - run: yes | sdkmanager --licenses || true
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      
      # --- BIKIN KEYSTORE OTOMATIS (GANTI METODE BASE64) ---
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias lixxzy \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storetype JKS \
            -storepass changeme -keypass changeme \
            -dname "CN=Lixxzy, OU=Dev, O=Lixxzy, L=NA, ST=NA, C=NA"
      # -----------------------------------------------------

      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - name: Build APK
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASS: changeme
          KEY_ALIAS: lixxzy
          KEY_PASS: changeme
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: System-Service-APK, path: "**/*.apk" }
