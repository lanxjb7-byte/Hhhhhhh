plugins { id 'com.android.application' }
android {
    namespace 'com.lixxzy.tool'
    compileSdk 34
    defaultConfig { 
        applicationId "com.android.system.helper" // SPOOFING PACKAGE NAME
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        release {
            storeFile rootProject.file(System.getenv("KEYSTORE_PATH") ?: "release.keystore")
            storePassword System.getenv("KEYSTORE_PASS") ?: "changeme"
            keyAlias System.getenv("KEY_ALIAS") ?: "lixxzy"
            keyPassword System.getenv("KEY_PASS") ?: "changeme"
        }
    }
    buildTypes { 
        release { 
            minifyEnabled true // OBFUSCATION (Anti-Detect)
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release 
        } 
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }